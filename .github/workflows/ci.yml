name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - run: python -m src.benchmark --config configs/config.yaml --sample
      - run: docker build -t dimbh .
      - run: docker run --rm dimbh